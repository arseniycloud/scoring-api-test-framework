[pytest]
pythonpath = .
testpaths = tests
# `-p no:playwright_visual_snapshot` disables a globally installed plugin that
# creates `snapshot_failures/` and `__snapshots__/` in the rootdir on every run.
# This suite is API-only and never takes screenshots, so the plugin is dead
# weight here. The flag is safe when the plugin is not installed at all.
addopts =
    -ra
    --strict-markers
    --strict-config
    -p no:playwright_visual_snapshot

markers =
    positive: positive scenario
    negative: negative scenario
    smoke: minimal set that proves the service is alive
    db: test reaches the scoring database (needs SCORING_DB_URL)

# Logging. The file keeps full DEBUG for CI artifacts; on a failure pytest
# prints the captured log of that test, so a red run is readable without a
# rerun. Live console logging is off by default (it duplicates the captured
# log in failure reports) — turn it on when debugging:
#     pytest -o log_cli=true
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)-18s %(message)s
log_cli_date_format = %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)-7s %(name)-18s %(funcName)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
